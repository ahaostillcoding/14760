      :root {
        --bg: #f6f2eb;
        --bg-deep: #ece4d8;
        --panel: rgba(255, 252, 247, 0.92);
        --panel-strong: #fffdfa;
        --text: #17222d;
        --muted: #657384;
        --line: rgba(23, 34, 45, 0.1);
        --line-strong: rgba(23, 34, 45, 0.18);
        --brand: #0d6b64;
        --brand-soft: rgba(13, 107, 100, 0.1);
        --accent: #bf6d2e;
        --accent-soft: rgba(191, 109, 46, 0.12);
        --warn: #a64a3d;
        --warn-soft: rgba(166, 74, 61, 0.12);
        --ink: #0d1a25;
        --shadow: 0 24px 56px rgba(19, 32, 44, 0.12);
        --radius-xl: 30px;
        --radius-lg: 22px;
        --radius-md: 16px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        color: var(--text);
        font-family: "Noto Sans SC", system-ui, sans-serif;
        background:
          radial-gradient(circle at left top, rgba(13, 107, 100, 0.14), transparent 24%),
          radial-gradient(circle at right top, rgba(191, 109, 46, 0.12), transparent 20%),
          linear-gradient(180deg, #fcfaf6 0%, var(--bg) 52%, var(--bg-deep) 100%);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        width: min(1240px, calc(100% - 28px));
        margin: 0 auto;
        padding: 22px 0 84px;
      }

      .mono {
        font-family: "Manrope", sans-serif;
      }

      .hero {
        position: relative;
        overflow: hidden;
        padding: 34px;
        border-radius: var(--radius-xl);
        color: #fff9f2;
        background:
          linear-gradient(136deg, rgba(10, 28, 42, 0.98), rgba(13, 84, 96, 0.95) 56%, rgba(183, 98, 41, 0.92)),
          #0e2533;
        box-shadow: var(--shadow);
      }

      .hero::before,
      .hero::after {
        content: "";
        position: absolute;
        border-radius: 999px;
        pointer-events: none;
      }

      .hero::before {
        width: 320px;
        height: 320px;
        right: -110px;
        top: -140px;
        background: rgba(255, 255, 255, 0.07);
      }

      .hero::after {
        width: 240px;
        height: 240px;
        left: -90px;
        bottom: -120px;
        background: rgba(255, 255, 255, 0.06);
      }

      .hero-grid,
      .stats-grid,
      .card-grid,
      .idea-grid,
      .trend-grid,
      .section-nav,
      .headline-grid,
      .footer-grid {
        display: grid;
        gap: 16px;
      }

      .hero-grid {
        position: relative;
        z-index: 1;
        grid-template-columns: minmax(0, 1.7fr) minmax(320px, 1fr);
        gap: 24px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 249, 242, 0.82);
        font-size: 0.88rem;
        letter-spacing: 0.06em;
      }

      .hero h1 {
        margin: 14px 0 16px;
        font-size: clamp(2.5rem, 4vw, 4.6rem);
        line-height: 0.98;
        letter-spacing: -0.05em;
      }

      .hero-intro {
        max-width: 780px;
        margin: 0;
        color: rgba(255, 249, 242, 0.84);
        line-height: 1.8;
        font-size: 1.02rem;
      }

      .hero-meta {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-top: 24px;
      }

      .glass,
      .section-shell,
      .card,
      .trend-card,
      .headline-card,
      .footer-panel {
        border: 1px solid var(--line);
      }

      .glass {
        padding: 16px 18px;
        border-radius: var(--radius-md);
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(12px);
      }

      .glass .label {
        display: block;
        margin-bottom: 8px;
        color: rgba(255, 249, 242, 0.68);
        font-size: 0.79rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .glass .value {
        display: block;
        font-size: 1.12rem;
        line-height: 1.5;
        font-weight: 700;
      }

      .hero-side {
        padding: 24px;
        border-radius: var(--radius-lg);
      }

      .hero-side h2,
      .section-head h2,
      .footer-panel h2 {
        margin: 0;
        font-size: 1rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .hero-side ul {
        list-style: none;
        margin: 18px 0 0;
        padding: 0;
        display: grid;
        gap: 16px;
      }

      .hero-side li {
        border-top: 1px solid rgba(255, 255, 255, 0.14);
        padding-top: 16px;
      }

      .hero-side li:first-child {
        border-top: 0;
        padding-top: 0;
      }

      .hero-side strong {
        display: block;
        margin-bottom: 6px;
      }

      .hero-side p {
        margin: 0;
        color: rgba(255, 249, 242, 0.76);
        line-height: 1.68;
        font-size: 0.94rem;
      }

      .section-nav {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        margin: 20px 0 26px;
      }

      .section-nav a {
        padding: 14px 16px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.62);
        color: var(--muted);
        font-size: 0.95rem;
        text-align: center;
        transition: transform 180ms ease, color 180ms ease, border-color 180ms ease;
      }

      .section-nav a:hover {
        transform: translateY(-2px);
        color: var(--brand);
        border-color: var(--brand);
      }

      .headline-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin-bottom: 28px;
      }

      .headline-card {
        padding: 22px;
        border-radius: var(--radius-lg);
        background: rgba(255, 255, 255, 0.7);
        box-shadow: 0 18px 36px rgba(19, 32, 44, 0.05);
      }

      .headline-card .label {
        color: var(--muted);
        font-size: 0.85rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .headline-card strong {
        display: block;
        margin-top: 12px;
        font-size: 1.18rem;
        line-height: 1.4;
      }

      .headline-card p {
        margin: 10px 0 0;
        color: var(--muted);
        line-height: 1.72;
      }

      .section-shell {
        padding: 24px;
        border-radius: var(--radius-xl);
        background: var(--panel);
        box-shadow: 0 22px 44px rgba(19, 32, 44, 0.06);
      }

      .section-shell + .section-shell {
        margin-top: 24px;
      }

      .section-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .section-head p {
        margin: 10px 0 0;
        color: var(--muted);
        line-height: 1.72;
      }

      .kicker {
        color: var(--accent);
        font-size: 0.84rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .stats-grid,
      .card-grid,
      .idea-grid,
      .trend-grid,
      .footer-grid {
        grid-template-columns: repeat(12, minmax(0, 1fr));
      }

      .stat-card,
      .card,
      .trend-card,
      .footer-panel {
        border-radius: var(--radius-lg);
      }

      .stat-card {
        grid-column: span 4;
        padding: 18px 20px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.75);
      }

      .stat-card strong {
        display: block;
        margin-bottom: 8px;
        font-size: 1.2rem;
      }

      .stat-card span {
        color: var(--muted);
        line-height: 1.7;
      }

      .card {
        grid-column: span 4;
        padding: 22px;
        background: var(--panel-strong);
      }

      .card h3 {
        margin: 14px 0 10px;
        font-size: 1.22rem;
        line-height: 1.42;
      }

      .card p {
        margin: 8px 0 0;
        color: var(--muted);
        line-height: 1.72;
      }

      .meta-row,
      .tag-row,
      .link-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .meta-row {
        align-items: center;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--brand-soft);
        color: var(--brand);
        font-size: 0.82rem;
        font-weight: 700;
      }

      .tag.accent {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .tag.warn {
        background: var(--warn-soft);
        color: var(--warn);
      }

      .summary-box {
        margin-top: 14px;
        padding: 14px 16px;
        border-radius: 14px;
        background: #f8f4ec;
        border: 1px solid rgba(23, 34, 45, 0.08);
      }

      .summary-box strong,
      .stack-line strong {
        color: var(--ink);
      }

      .stack-line {
        margin-top: 10px;
      }

      .link-row {
        margin-top: 16px;
      }

      .link-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid var(--line-strong);
        color: var(--ink);
        font-weight: 700;
      }

      .link-button:hover {
        border-color: var(--brand);
        color: var(--brand);
      }

      .trend-card {
        grid-column: span 4;
        padding: 20px 22px;
        background: linear-gradient(180deg, rgba(13, 107, 100, 0.08), rgba(255, 255, 255, 0.9));
      }

      .trend-card strong {
        display: block;
        margin: 12px 0 8px;
        font-size: 1.05rem;
      }

      .trend-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.72;
      }

      .idea-card {
        grid-column: span 6;
      }

      .footer-grid {
        margin-top: 22px;
      }

      .footer-panel {
        grid-column: span 6;
        padding: 22px;
        background: rgba(255, 255, 255, 0.68);
      }

      .footer-panel p,
      .footer-panel li {
        color: var(--muted);
        line-height: 1.72;
      }

      .footer-panel ul {
        margin: 14px 0 0;
        padding-left: 18px;
      }

      .footer-panel li + li {
        margin-top: 8px;
      }

      .muted {
        color: var(--muted);
      }

      @media (max-width: 1080px) {
        .hero-grid,
        .section-head {
          grid-template-columns: 1fr;
        }

        .hero-grid {
          display: block;
        }

        .hero-side {
          margin-top: 20px;
        }

        .section-head {
          display: block;
        }

        .headline-grid,
        .section-nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .card,
        .trend-card,
        .stat-card,
        .footer-panel {
          grid-column: span 6;
        }
      }

      @media (max-width: 780px) {
        .page {
          width: min(100% - 18px, 100%);
          padding: 12px 0 56px;
        }

        .hero,
        .section-shell {
          padding: 20px;
        }

        .hero h1 {
          font-size: 2.4rem;
        }

        .hero-meta,
        .headline-grid,
        .section-nav {
          grid-template-columns: 1fr;
        }

        .card,
        .trend-card,
        .stat-card,
        .footer-panel,
        .idea-card {
          grid-column: span 12;
        }
      }
    </style>
