    <style>
      :root {
        --bg: #f4efe7;
        --bg-strong: #f9f5ef;
        --panel: rgba(255, 252, 247, 0.88);
        --panel-strong: #fffdf9;
        --text: #18212c;
        --muted: #5f6974;
        --line: rgba(24, 33, 44, 0.1);
        --line-strong: rgba(24, 33, 44, 0.18);
        --brand: #0b6f66;
        --brand-soft: rgba(11, 111, 102, 0.1);
        --gold: #bf6d1a;
        --gold-soft: rgba(191, 109, 26, 0.12);
        --danger: #9d4738;
        --danger-soft: rgba(157, 71, 56, 0.12);
        --ink: #0d1620;
        --shadow: 0 20px 60px rgba(28, 39, 52, 0.12);
        --radius: 24px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        color: var(--text);
        font-family: "Noto Sans SC", system-ui, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(11, 111, 102, 0.15), transparent 28%),
          radial-gradient(circle at top right, rgba(191, 109, 26, 0.15), transparent 30%),
          linear-gradient(180deg, #fbf8f2 0%, var(--bg) 48%, #ebe3d8 100%);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        width: min(1240px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 80px;
      }

      .hero {
        position: relative;
        overflow: hidden;
        border-radius: 34px;
        padding: 34px;
        color: #f8f7f3;
        background:
          radial-gradient(circle at 75% 16%, rgba(255, 215, 159, 0.26), transparent 24%),
          linear-gradient(135deg, rgba(8, 26, 38, 0.98), rgba(10, 92, 95, 0.93));
        box-shadow: var(--shadow);
      }

      .hero::after {
        content: "";
        position: absolute;
        right: -10%;
        bottom: -46%;
        width: 440px;
        height: 320px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(255, 211, 143, 0.34), transparent 68%);
        pointer-events: none;
      }

      .mono,
      .chip,
      .pill,
      .jump-link {
        font-family: "Space Grotesk", sans-serif;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.14);
      }

      h1 {
        margin: 16px 0 14px;
        max-width: 820px;
        font-size: clamp(34px, 5vw, 64px);
        line-height: 1.02;
        letter-spacing: -0.05em;
      }

      .hero-summary {
        max-width: 820px;
        margin: 0;
        font-size: 17px;
        line-height: 1.8;
        color: rgba(248, 247, 243, 0.9);
      }

      .hero-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(280px, 0.82fr);
        gap: 18px;
        margin-top: 24px;
      }

      .hero-panel {
        position: relative;
        z-index: 1;
        padding: 20px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(12px);
      }

      .hero-panel h2,
      .section-head h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.03em;
      }

      .hero-points,
      .trend-list,
      .judgement-list {
        margin: 14px 0 0;
        padding-left: 18px;
        line-height: 1.8;
        color: rgba(248, 247, 243, 0.9);
      }

      .meta-row,
      .jump-links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .meta-row {
        margin-top: 16px;
      }

      .chip,
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        white-space: nowrap;
      }

      .chip {
        padding: 8px 12px;
        font-size: 12px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.14);
      }

      .jump-links {
        margin-top: 14px;
      }

      .jump-link {
        padding: 10px 14px;
        font-size: 13px;
        border-radius: 999px;
        color: var(--ink);
        background: rgba(255, 247, 235, 0.92);
      }

      .section {
        margin-top: 22px;
        border-radius: 30px;
        padding: 28px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.74), rgba(255, 255, 255, 0.5));
        border: 1px solid rgba(255, 255, 255, 0.48);
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 16px;
        margin-bottom: 18px;
      }

      .section-copy {
        max-width: 760px;
      }

      .section-copy p {
        margin: 10px 0 0;
        color: var(--muted);
        line-height: 1.8;
      }

      .pill {
        padding: 8px 12px;
        font-size: 12px;
        color: var(--brand);
        background: var(--brand-soft);
        border: 1px solid rgba(11, 111, 102, 0.14);
      }

      .pill.warning {
        color: var(--gold);
        background: var(--gold-soft);
        border-color: rgba(191, 109, 26, 0.16);
      }

      .pill.risk {
        color: var(--danger);
        background: var(--danger-soft);
        border-color: rgba(157, 71, 56, 0.16);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 16px;
      }

      .card {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 100%;
        padding: 20px;
        border-radius: 22px;
        background: var(--panel);
        border: 1px solid var(--line);
      }

      .card.span-6 {
        grid-column: span 6;
      }

      .card.span-4 {
        grid-column: span 4;
      }

      .card.span-12 {
        grid-column: span 12;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }

      .card h3 {
        margin: 0;
        font-size: 20px;
        line-height: 1.35;
        letter-spacing: -0.03em;
      }

      .subhead {
        margin: 6px 0 0;
        font-size: 13px;
        color: var(--muted);
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        padding: 7px 10px;
        border-radius: 999px;
        font-size: 11px;
        color: var(--ink);
        background: rgba(24, 33, 44, 0.06);
      }

      .summary-box,
      .judgement-box {
        padding: 14px 16px;
        border-radius: 16px;
        background: var(--panel-strong);
        border: 1px solid var(--line);
      }

      .summary-box strong,
      .judgement-box strong {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
      }

      .summary-box p,
      .judgement-box p,
      .note,
      .list-line {
        margin: 0;
        color: var(--muted);
        line-height: 1.75;
        font-size: 14px;
      }

      .list-block {
        display: grid;
        gap: 10px;
      }

      .list-line strong {
        color: var(--text);
      }

      .card-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: auto;
        padding-top: 4px;
      }

      .source-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 999px;
        font-size: 13px;
        color: var(--brand);
        background: rgba(11, 111, 102, 0.08);
      }

      .source-link:hover {
        background: rgba(11, 111, 102, 0.14);
      }

      .score {
        font-size: 12px;
        color: var(--muted);
      }

      .panel-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .footer {
        margin-top: 22px;
        padding: 24px 28px;
        border-radius: 26px;
        color: #f8f7f3;
        background:
          radial-gradient(circle at 80% 18%, rgba(255, 216, 151, 0.22), transparent 24%),
          linear-gradient(135deg, #102333, #204c5f);
        box-shadow: var(--shadow);
      }

      .footer p {
        margin: 10px 0 0;
        line-height: 1.8;
        color: rgba(248, 247, 243, 0.9);
      }

      @media (max-width: 980px) {
        .hero-grid,
        .panel-row {
          grid-template-columns: 1fr;
        }

        .card.span-6,
        .card.span-4 {
          grid-column: span 12;
        }
      }

      @media (max-width: 720px) {
        .page {
          width: min(100% - 20px, 1240px);
          padding-top: 10px;
        }

        .hero,
        .section,
        .footer {
          padding: 22px;
          border-radius: 24px;
        }

        h1 {
          font-size: 34px;
        }

        .section-head,
        .card-header,
        .card-footer {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
