    <style>
      :root {
        --bg: #f4efe8;
        --bg-2: #e7ddd0;
        --panel: rgba(255, 251, 246, 0.94);
        --panel-strong: #fffdfa;
        --text: #18232d;
        --muted: #63717f;
        --line: rgba(24, 35, 45, 0.11);
        --brand: #0e665f;
        --brand-soft: rgba(14, 102, 95, 0.11);
        --accent: #bf6b31;
        --accent-soft: rgba(191, 107, 49, 0.12);
        --warn: #8d3e36;
        --warn-soft: rgba(141, 62, 54, 0.12);
        --shadow: 0 24px 64px rgba(20, 30, 39, 0.12);
        --radius-xl: 30px;
        --radius-lg: 24px;
        --radius-md: 18px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        color: var(--text);
        font-family: "Noto Sans SC", system-ui, sans-serif;
                background:
          radial-gradient(circle at top left, rgba(14, 102, 95, 0.16), transparent 25%),
          radial-gradient(circle at top right, rgba(191, 107, 49, 0.12), transparent 20%),
          linear-gradient(180deg, #fcf8f2 0%, var(--bg) 52%, var(--bg-2) 100%);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        width: min(1240px, calc(100% - 28px));
        margin: 0 auto;
        padding: 24px 0 84px;
      }

      .mono {
        font-family: "Manrope", sans-serif;
      }

      .brief-switcher {
        position: fixed;
        top: 12px;
        left: 50%;
        z-index: 999;
        transform: translateX(-50%);
        width: min(1120px, calc(100% - 24px));
        padding: 12px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid rgba(24, 35, 45, 0.12);
        border-radius: 18px;
        background: rgba(255, 251, 246, 0.88);
        backdrop-filter: blur(16px);
        box-shadow: 0 18px 42px rgba(20, 30, 39, 0.12);
      }

      .brief-switcher-label {
        color: #51606f;
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }

      .brief-switcher-buttons {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      .brief-switcher-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid rgba(24, 35, 45, 0.12);
        background: rgba(255, 255, 255, 0.78);
        color: #18232d;
        font-size: 13px;
        font-weight: 700;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background 160ms ease;
      }

      .brief-switcher-button:hover {
        transform: translateY(-1px);
        border-color: rgba(14, 102, 95, 0.4);
      }

      .brief-switcher-button.is-active {
        background: #0e665f;
        border-color: #0e665f;
        color: #f8fbfb;
      }

      .hero {
        position: relative;
        overflow: hidden;
        padding: 34px;
        border-radius: var(--radius-xl);
        border: 1px solid rgba(255, 255, 255, 0.7);
        background:
          linear-gradient(135deg, rgba(14, 102, 95, 0.98), rgba(13, 31, 40, 0.98)),
          linear-gradient(145deg, rgba(191, 107, 49, 0.26), transparent 48%);
        color: #f8fbfb;
        box-shadow: var(--shadow);
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: auto -70px -90px auto;
        width: 310px;
        height: 310px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.18), transparent 66%);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        font-size: 13px;
        letter-spacing: 0.04em;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.92fr);
        gap: 24px;
        margin-top: 20px;
      }

      .hero h1 {
        margin: 0 0 14px;
        font-size: clamp(34px, 5vw, 56px);
        line-height: 1.03;
      }

      .hero p {
        margin: 0;
        max-width: 760px;
        color: rgba(248, 251, 251, 0.84);
        font-size: 16px;
        line-height: 1.8;
      }

      .snapshot,
      .toc,
      .section,
      .card,
      .summary-card {
        border-radius: var(--radius-lg);
        border: 1px solid var(--line);
        background: var(--panel);
        backdrop-filter: blur(16px);
      }

      .snapshot,
      .toc,
      .card,
      .summary-card {
        padding: 20px;
      }

      .snapshot h2,
      .toc h2,
      .section h2 {
        margin: 0;
        font-size: 20px;
      }

      .snapshot-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 16px;
      }

      .metric {
        padding: 14px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .metric strong {
        display: block;
        font-size: 26px;
        line-height: 1;
      }

      .metric span {
        display: block;
        margin-top: 8px;
        font-size: 13px;
        color: rgba(248, 251, 251, 0.7);
      }

      .toc ul {
        margin: 12px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 10px;
      }

      .toc li {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
      }

      .toc-index {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: inline-grid;
        place-items: center;
        background: var(--brand-soft);
        color: var(--brand);
        font-size: 12px;
        font-weight: 800;
      }

      .main {
        display: grid;
        gap: 22px;
        margin-top: 22px;
      }

      .section {
        padding: 24px;
        box-shadow: var(--shadow);
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
      }

      .section-desc {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.78;
      }

      .chip-row,
      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip,
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }

      .chip {
        background: var(--brand-soft);
        color: var(--brand);
      }

      .tag {
        background: rgba(24, 35, 45, 0.06);
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 16px;
        margin-top: 20px;
      }

      .span-4 {
        grid-column: span 4;
      }

      .span-6 {
        grid-column: span 6;
      }

      .span-12 {
        grid-column: span 12;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: flex-start;
      }

      .card h3 {
        margin: 0;
        font-size: 21px;
        line-height: 1.34;
      }

      .card-subtitle {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .stat {
        min-width: 92px;
        padding: 10px 12px;
        border-radius: 16px;
        background: var(--accent-soft);
        color: var(--accent);
        text-align: right;
      }

      .stat strong {
        display: block;
        font-size: 17px;
      }

      .stat span {
        font-size: 12px;
      }

      .summary-card {
        background: linear-gradient(160deg, rgba(14, 102, 95, 0.08), rgba(191, 107, 49, 0.06));
      }

      .card p,
      .summary-card p,
      .card li {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.75;
      }

      .key-block {
        margin-top: 16px;
        padding: 14px;
        border-radius: 16px;
        background: rgba(24, 35, 45, 0.04);
      }

      .key-block strong,
      .mini-title {
        display: block;
        margin-bottom: 8px;
        color: var(--text);
        font-size: 13px;
      }

      .list {
        margin: 14px 0 0;
        padding-left: 18px;
        display: grid;
        gap: 8px;
      }

      .meta {
        margin-top: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }

      .source-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 999px;
        background: var(--panel-strong);
        border: 1px solid var(--line);
        color: var(--text);
        font-weight: 700;
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          box-shadow 180ms ease;
      }

      .source-link:hover {
        transform: translateY(-2px);
        border-color: var(--brand);
        box-shadow: 0 12px 24px rgba(14, 102, 95, 0.12);
      }

      .callout {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 14px;
        background: var(--warn-soft);
        color: var(--warn);
        font-size: 13px;
        line-height: 1.7;
      }

      .footer {
        margin-top: 24px;
        padding: 18px 20px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.8;
      }

      @media (max-width: 1100px) {
        .hero-grid,
        .snapshot-grid {
          grid-template-columns: 1fr;
        }

        .span-4,
        .span-6 {
          grid-column: span 12;
        }
      }

      @media (max-width: 720px) {
        body {
                  }

        .page {
          width: min(100% - 18px, 1240px);
          padding-top: 16px;
        }

        .brief-switcher {
          top: 8px;
          width: calc(100% - 16px);
          padding: 10px 12px;
          border-radius: 16px;
          align-items: flex-start;
          flex-direction: column;
        }

        .brief-switcher-buttons {
          justify-content: flex-start;
        }

        .hero,
        .section {
          padding: 20px;
        }

        .snapshot,
        .toc,
        .card,
        .summary-card {
          padding: 16px;
        }

        .section-head,
        .card-header {
          flex-direction: column;
        }

        .stat {
          text-align: left;
        }

        .hero h1 {
          font-size: 34px;
        }
      }
    </style>

      function Pill({ children, tone = "default" }) {
        return <span className={tone === "chip" ? "chip" : "tag"}>{children}</span>;
      }

      function SectionHeader({ id, title, desc, chips = [] }) {
        return (
          <div id={id}>
            <div className="section-head">
              <div>
                <h2>{title}</h2>
                <p className="section-desc">{desc}</p>
              </div>
              <div className="chip-row">
                {chips.map((chip) => (
                  <Pill key={chip} tone="chip">
                    {chip}
                  </Pill>
                ))}
              </div>
            </div>
          </div>
        );
      }

      function ProjectCard({ item }) {
        return (
          <article className="card span-6">
            <div className="card-header">
              <div>
                <h3>{item.name}</h3>
                <p className="card-subtitle">最近活跃：{item.updatedAt}</p>
              </div>
              <div className="stat">
                <strong>{item.stars}</strong>
                <span>GitHub Stars</span>
              </div>
            </div>
            <div className="tag-row" style={{ marginTop: 14 }}>
              {item.tags.map((tag) => (
                <Pill key={tag}>{tag}</Pill>
              ))}
            </div>
            <div className="key-block">
              <strong>主要用途</strong>
              <p>{item.purpose}</p>
            </div>
            <div className="key-block">
              <strong>核心亮点</strong>
              <p>{item.highlight}</p>
            </div>
            <div className="key-block">
              <strong>为什么现在值得看</strong>
              <p>{item.whyNow}</p>
            </div>
            <div className="meta">
              <span className="mini-title">来源：GitHub 仓库元数据</span>
              <a className="source-link" href={item.url} target="_blank" rel="noreferrer">
                查看项目
              </a>
            </div>
          </article>
        );
      }

      function NewsCard({ item, compact = false }) {
        return (
          <article className={`card ${compact ? "span-4" : "span-6"}`}>
            <div className="card-header">
              <div>

              <a className="source-link" href={item.url} target="_blank" rel="noreferrer">
