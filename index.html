      :root {
        --bg: #f3efe6;
        --bg-deep: #e7ddcf;
        --panel: rgba(255, 252, 247, 0.88);
        --panel-strong: #fffdfa;
        --text: #17212b;
        --muted: #62707d;
        --line: rgba(23, 33, 43, 0.09);
        --line-strong: rgba(23, 33, 43, 0.16);
        --brand: #0c6d63;
        --brand-soft: rgba(12, 109, 99, 0.1);
        --accent: #b86a22;
        --accent-soft: rgba(184, 106, 34, 0.1);
        --warning: #9d4737;
        --warning-soft: rgba(157, 71, 55, 0.1);
        --shadow: 0 20px 55px rgba(31, 42, 54, 0.12);
        --radius-xl: 32px;
        --radius-lg: 24px;
        --radius-md: 18px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        color: var(--text);
        font-family: "Noto Sans SC", system-ui, sans-serif;
        background:
          radial-gradient(circle at 10% 0%, rgba(12, 109, 99, 0.16), transparent 24%),
          radial-gradient(circle at 90% 0%, rgba(184, 106, 34, 0.14), transparent 26%),
          linear-gradient(180deg, #fbf8f2 0%, var(--bg) 52%, var(--bg-deep) 100%);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        width: min(1240px, calc(100% - 32px));
        margin: 0 auto;
        padding: 22px 0 80px;
      }

      .mono {
        font-family: "Manrope", sans-serif;
      }

      .hero {
        position: relative;
        overflow: hidden;
        padding: 34px;
        border-radius: var(--radius-xl);
        color: #fbf8f3;
        background:
          radial-gradient(circle at 78% 14%, rgba(255, 219, 168, 0.24), transparent 24%),
          linear-gradient(135deg, #0b1826, #0f5c62 55%, #14413f);
        box-shadow: var(--shadow);
      }

      .hero::after {
        content: "";
        position: absolute;
        right: -80px;
        bottom: -120px;
        width: 360px;
        height: 360px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(255, 226, 185, 0.26), transparent 68%);
        pointer-events: none;
      }

      .eyebrow,
      .chip,
      .jump-link,
      .pill,
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
      }

      .eyebrow {
        padding: 8px 12px;
        font-size: 12px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.14);
      }

      h1 {
        margin: 16px 0 14px;
        max-width: 860px;
        font-size: clamp(34px, 5vw, 62px);
        line-height: 1.02;
        letter-spacing: -0.05em;
      }

      .hero-summary {
        max-width: 860px;
        margin: 0;
        line-height: 1.82;
        font-size: 17px;
        color: rgba(251, 248, 243, 0.9);
      }

      .meta-row,
      .jump-row,
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .meta-row {
        margin-top: 18px;
      }

      .chip {
        padding: 8px 12px;
        font-size: 12px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.14);
      }

      .jump-row {
        margin-top: 16px;
      }

      .jump-link {
        padding: 10px 14px;
        color: #10202d;
        font-size: 13px;
        background: rgba(255, 247, 235, 0.94);
      }

      .hero-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.22fr) minmax(280px, 0.78fr);
        gap: 18px;
        margin-top: 24px;
      }

      .hero-panel {
        position: relative;
        z-index: 1;
        padding: 20px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(12px);
      }

      .hero-panel h2,
      .section-head h2 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.03em;
      }

      .hero-panel ul,
      .trend-list,

        margin: 12px 0 0;
        padding-left: 18px;
        line-height: 1.82;
      }

        margin-top: 22px;
        padding: 28px;

        background: linear-gradient(180deg, rgba(255, 255, 255, 0.74), rgba(255, 255, 255, 0.52));
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 16px;
        margin-bottom: 18px;

        max-width: 780px;
      }

      .footer p,
      .line,
      .card-note {
        margin: 10px 0 0;
        line-height: 1.8;
        color: var(--muted);

        font-size: 12px;

        background: var(--brand-soft);
        border: 1px solid rgba(12, 109, 99, 0.14);

        color: var(--accent);
        background: var(--accent-soft);
        border-color: rgba(184, 106, 34, 0.16);
      }

      .pill.risk {
        color: var(--warning);
        background: var(--warning-soft);
        border-color: rgba(157, 71, 55, 0.16);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 16px;
      }

      .card {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 100%;
        padding: 20px;
        border-radius: var(--radius-lg);
        background: var(--panel);
        border: 1px solid var(--line);
      }

      .span-12 {
        grid-column: span 12;
      }

      .span-6 {
        grid-column: span 6;
      }

      .span-4 {
        grid-column: span 4;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }

      .card h3 {
        margin: 0;
        font-size: 20px;
        line-height: 1.34;
        letter-spacing: -0.03em;
      }

      .subhead {
        margin: 6px 0 0;
        font-size: 13px;
        color: var(--muted);
      }

      .tag {
        padding: 7px 10px;
        font-size: 11px;
        background: rgba(23, 33, 43, 0.06);
        color: #152331;
      }

      .box {
        padding: 14px 16px;
        border-radius: var(--radius-md);
        background: var(--panel-strong);
        border: 1px solid var(--line);
      }

      .box strong,
      .mini-title {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
      }

      .box p,
      .box li {
        margin: 0;
        font-size: 14px;
        line-height: 1.76;
        color: var(--muted);
      }

      .box ul {
        margin: 0;
        padding-left: 18px;
      }

      .source-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: auto;
      }

      .source-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 999px;
        font-size: 13px;
        color: var(--brand);
        background: rgba(12, 109, 99, 0.08);
      }

      .source-link:hover {
        background: rgba(12, 109, 99, 0.14);
      }

      .score {
        font-size: 12px;
        color: var(--muted);
      }

      .panel-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 18px;
      }

        margin-top: 22px;
        padding: 24px 28px;
        border-radius: 28px;
        color: #fbf8f3;
        background:

      }

        .hero-grid,
        .panel-row {
          grid-template-columns: 1fr;
        }

        .span-4 {

        }

        .page {
          width: min(100% - 20px, 1240px);
          padding-top: 10px;
        }

        .section,
        .footer {
          padding: 22px;
          border-radius: 24px;
        }

        h1 {
          font-size: 34px;
        }

        .section-head,
        .card-header,
        .source-row {
          flex-direction: column;
          align-items: flex-start;
        }
      }
