    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

      rel="stylesheet"
    />

    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <style>
      :root {
        --bg: #f5f1e8;
        --bg-2: #efe8dc;
        --panel: rgba(255, 251, 245, 0.84);
        --panel-strong: #fffdfa;
        --text: #18212b;
        --muted: #5f6c77;
        --line: rgba(24, 33, 43, 0.1);
        --brand: #0f6b68;
        --brand-soft: rgba(15, 107, 104, 0.1);
        --gold: #bc6f17;
        --gold-soft: rgba(188, 111, 23, 0.12);
        --danger: #9a4b37;
        --danger-soft: rgba(154, 75, 55, 0.12);
        --shadow: 0 24px 80px rgba(34, 44, 56, 0.12);
        --radius: 24px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Noto Sans SC", system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(15, 107, 104, 0.18), transparent 28%),
          radial-gradient(circle at top right, rgba(188, 111, 23, 0.18), transparent 30%),
          linear-gradient(180deg, #fbf8f2 0%, var(--bg) 52%, var(--bg-2) 100%);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        width: min(1200px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 72px;
      }

      .hero {
        position: relative;
        overflow: hidden;
        border-radius: 34px;
        padding: 32px;
        color: #f7f6f2;
        background:
          radial-gradient(circle at 75% 20%, rgba(255, 202, 130, 0.3), transparent 22%),
          linear-gradient(135deg, rgba(10, 40, 58, 0.98), rgba(12, 98, 101, 0.92));
        box-shadow: var(--shadow);
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: auto -10% -42% 36%;
        height: 300px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(255, 209, 143, 0.34), transparent 64%);
        pointer-events: none;
      }

      .eyebrow,
      .meta-chip,
      .tag,
      .card-kicker,
      .link-pill {
        font-family: "Space Grotesk", sans-serif;
        letter-spacing: 0.02em;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.16);
      }

      h1 {
        margin: 18px 0 14px;
        font-size: clamp(34px, 5vw, 62px);
        line-height: 1.02;
        letter-spacing: -0.04em;
      }

      .hero-summary {
        max-width: 780px;
        margin: 0;
        font-size: 17px;
        line-height: 1.75;
        color: rgba(247, 246, 242, 0.9);
      }

      .hero-grid {
        display: grid;
        grid-template-columns: 1.35fr 0.9fr;
        gap: 18px;
        margin-top: 26px;
      }

      .hero-panel {
        position: relative;
        z-index: 1;
        padding: 18px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .hero-panel h3 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      .hero-points,
      .signal-list,
      .source-list {
        margin: 0;
        padding-left: 18px;
      }

      .hero-points li,
      .signal-list li,
      .source-list li {
        margin-bottom: 10px;
        line-height: 1.7;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .stat-card {
        padding: 16px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .stat-card strong {
        display: block;
        font-family: "Space Grotesk", sans-serif;
        font-size: 28px;
        line-height: 1;
        margin-bottom: 8px;
      }

      .stat-card span {
        color: rgba(247, 246, 242, 0.86);
        line-height: 1.6;
        font-size: 14px;
      }

      .section {
        margin-top: 24px;
        padding: 24px;
        border-radius: 28px;
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 16px;
        margin-bottom: 20px;
      }

      .section-header h2 {
        margin: 0 0 8px;
        font-size: 28px;
        letter-spacing: -0.03em;
      }

      .section-header p {
        margin: 0;
        color: var(--muted);
        line-height: 1.75;
        max-width: 760px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 16px;
      }

      .card {
        grid-column: span 6;
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 100%;
        padding: 18px;
        border-radius: var(--radius);
        background: var(--panel-strong);
        border: 1px solid var(--line);
      }

      .card.compact {
        grid-column: span 4;
      }

      .card.wide {
        grid-column: span 12;
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }

      .card-top h3 {
        margin: 4px 0 0;
        font-size: 22px;
        line-height: 1.22;
        letter-spacing: -0.03em;
      }

      .card-kicker {
        font-size: 12px;
        color: var(--brand);
      }

      .status {
        flex: none;
        padding: 7px 10px;
        border-radius: 999px;
        font-size: 12px;
        background: var(--brand-soft);
        color: var(--brand);
      }

      .status.verify {
        background: var(--gold-soft);
        color: var(--gold);
      }

      .status.caution {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tag {
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 11px;
        color: var(--muted);
        background: #f2ede3;
        border: 1px solid rgba(24, 33, 43, 0.06);
      }

      .copy-block {
        display: grid;
        gap: 10px;
      }

      .label {
        display: block;
        margin-bottom: 5px;
        font-size: 12px;
        color: var(--muted);
      }

      .copy-block p {
        margin: 0;
        line-height: 1.75;
      }

      .link-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 10px;
        margin-top: auto;
        padding-top: 4px;
      }

      .link-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 12px;
        border-radius: 999px;
        font-size: 12px;
        color: var(--brand);
        background: var(--brand-soft);
      }

      .muted-note {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .trend-box {
        padding: 18px;
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(15, 107, 104, 0.08), rgba(15, 107, 104, 0.02));
        border: 1px solid rgba(15, 107, 104, 0.12);
      }

      .trend-box h3,
      .judgment-box h3 {
        margin: 0 0 12px;
        font-size: 20px;
      }

      .judgment-box {
        padding: 24px;
        border-radius: 24px;
        background:
          radial-gradient(circle at top right, rgba(188, 111, 23, 0.14), transparent 28%),
          linear-gradient(180deg, rgba(12, 98, 101, 0.08), rgba(255, 255, 255, 0.65));
        border: 1px solid rgba(24, 33, 43, 0.08);
      }

      .footer {
        margin-top: 18px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }

      @media (max-width: 980px) {
        .hero-grid,
        .stats {
          grid-template-columns: 1fr;
        }

        .card,
        .card.compact {
          grid-column: span 12;
        }
      }

      @media (max-width: 720px) {
        .page {
          width: min(100% - 20px, 1200px);
          padding-top: 10px;
        }

        .hero,
        .section {
          padding: 20px;
          border-radius: 24px;
        }

        h1 {
          font-size: 34px;
        }

        .section-header {
          align-items: flex-start;
        }
      }
    </style>
  </head>
