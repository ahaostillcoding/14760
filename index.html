    <style>
      :root {
        --bg: #f4efe6;
        --bg-accent: #efe4d0;
        --panel: rgba(255, 252, 247, 0.88);
        --panel-strong: #fffdf8;
        --text: #14212b;
        --muted: #566675;
        --line: rgba(20, 33, 43, 0.1);
        --brand: #0d6b6f;
        --brand-soft: rgba(13, 107, 111, 0.1);
        --warn: #9a4d16;
        --warn-soft: rgba(154, 77, 22, 0.12);
        --shadow: 0 24px 60px rgba(36, 47, 56, 0.12);
        --radius: 22px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(13, 107, 111, 0.18), transparent 28%),
          radial-gradient(circle at top right, rgba(196, 124, 45, 0.2), transparent 30%),
          linear-gradient(180deg, #fbf7f0 0%, var(--bg) 52%, #ece3d7 100%);
      }

      a {
        color: inherit;
      }

      .page {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 64px;
      }

      .hero {
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, rgba(8, 52, 66, 0.96), rgba(12, 95, 103, 0.9));
        color: #f8f6f0;
        border-radius: 32px;
        padding: 32px;
        box-shadow: var(--shadow);
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: auto -10% -35% 35%;
        height: 280px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(245, 170, 74, 0.34), transparent 62%);
        pointer-events: none;
      }

      .eyebrow,
      .meta-strip span,
      .chip,
      .card-top span {
        font-family: "IBM Plex Mono", monospace;
        letter-spacing: 0.02em;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.16);
      }

      h1 {
        margin: 18px 0 14px;
        font-size: clamp(34px, 5vw, 58px);
        line-height: 1.02;
        letter-spacing: -0.04em;
      }

      .hero p {
        margin: 0;
        max-width: 760px;
        font-size: 17px;
        line-height: 1.7;
        color: rgba(248, 246, 240, 0.9);
      }

      .meta-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }

      .meta-strip span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 14px;
        font-size: 12px;
        color: rgba(248, 246, 240, 0.9);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .section {
        margin-top: 24px;
        background: var(--panel);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 28px;
        padding: 24px;
        box-shadow: var(--shadow);
      }

      .section-header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }

      .section-header h2 {
        margin: 0 0 8px;
        font-size: 28px;
        letter-spacing: -0.03em;
      }

      .section-header p {
        margin: 0;
        max-width: 760px;
        color: var(--muted);
        line-height: 1.7;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 16px;
      }

      .card {
        grid-column: span 6;
        background: var(--panel-strong);
        border-radius: var(--radius);
        border: 1px solid var(--line);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 100%;
      }

      .card.compact {
        grid-column: span 4;
      }

      .card.wide {
        grid-column: span 12;
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }

      .card-top h3 {
        margin: 0;
        font-size: 22px;
        line-height: 1.2;
        letter-spacing: -0.03em;
      }

      .card-top span {
        flex: none;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 11px;
        color: var(--brand);
        background: var(--brand-soft);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        padding: 6px 10px;
        font-size: 11px;
        border-radius: 999px;
        color: var(--muted);
        background: #f2ede3;
        border: 1px solid rgba(20, 33, 43, 0.06);
      }

      .summary,
      .judgment,
      .audience,
      .reason {
        margin: 0;
        line-height: 1.7;
        color: var(--text);
      }

      .label {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        color: var(--muted);
      }

      .insight {
        padding: 14px 16px;
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(13, 107, 111, 0.07), rgba(13, 107, 111, 0.03));
        border: 1px solid rgba(13, 107, 111, 0.1);
      }

      .insight.warn {
        background: linear-gradient(180deg, rgba(154, 77, 22, 0.1), rgba(154, 77, 22, 0.04));
        border-color: rgba(154, 77, 22, 0.14);
      }

      .footer-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: auto;
        text-decoration: none;
        font-weight: 600;
        color: var(--brand);
      }

      .trend-list,
      .summary-list {
        display: grid;
        gap: 14px;
      }

      .trend-item {
        padding: 16px 18px;
        border-radius: 18px;
        background: var(--panel-strong);
        border: 1px solid var(--line);
      }

      .trend-item h3 {
        margin: 0 0 8px;
        font-size: 18px;
      }

      .trend-item p,
      .summary-list p {
        margin: 0;
        line-height: 1.7;
        color: var(--muted);
      }

      .closing {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 16px;
      }

      .sources {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }

      .sources a {
        text-decoration: none;
        padding: 8px 10px;
        border-radius: 999px;
        font-size: 12px;
        border: 1px solid var(--line);
        background: #f5f1ea;
        color: var(--muted);
      }

      @media (max-width: 900px) {
        .card,
        .card.compact,
        .closing > * {
          grid-column: span 12;
        }

        .closing {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        .page {
          width: min(100% - 20px, 100%);
          padding-top: 18px;
        }

        .hero,
        .section {
          padding: 18px;
          border-radius: 24px;
        }

        .card-top {
          flex-direction: column;
        }

        .card-top h3 {
          font-size: 20px;
        }
      }
    </style>
  </head>

        );

      function InfoCard({ item, kind }) {
        return (
          <article className={`card ${kind === "idea" ? "compact" : ""}`}>
            <div className="card-top">
              <h3>{item.name || item.title}</h3>
              <span>{item.tag || item.source}</span>
            </div>
            {item.tags && (
              <div className="chips">
                {item.tags.map((tag) => (
                  <span className="chip" key={tag}>

                ))}
              </div>
            )}
            <div>
              <span className="label">摘要</span>
              <p className="summary">{item.summary}</p>
            </div>
            {(item.highlight || item.impact || item.mvp) && (
              <div className={`insight ${item.summary.includes("待进一步确认") ? "warn" : ""}`}>
                <span className="label">
                  {item.highlight ? "核心亮点" : item.impact ? "影响判断" : "MVP 思路"}
                </span>
                <p className="judgment">{item.highlight || item.impact || item.mvp}</p>
              </div>
            )}
            {item.whyNow && (
              <div>
                <span className="label">为什么现在值得看</span>
                <p className="reason">{item.whyNow}</p>
              </div>
            )}
            {item.audience && (
              <div>
                <span className="label">适合关注的人群</span>

              </div>
            )}
            <a className="footer-link" href={item.link} target="_blank" rel="noreferrer">
              查看链接
            </a>
          </article>
        );
      }
