<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="清迈 3 天悠闲自由行规划：古城、素贴山、夜市，微笑兰纳酒店周边住宿，含酒店与美食推荐。">
<title>清迈 3 天悠闲自由行 · 兰纳之夜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#1b2133;
    --night-2:#232b44;
    --night-3:#141a29;
    --paper:#f6f1e3;
    --paper-2:#efe8d4;
    --paper-3:#fbf7ec;
    --ink:#26282f;
    --muted:#7d7766;
    --gold:#c09a4b;
    --gold-light:#e0c068;
    --gold-deep:#a67b2e;
    --gold-soft:rgba(192,154,75,.16);
    --line:rgba(154,124,44,.26);
    --teal:#3f6f59;
    --radius:18px;
    --ease-out:cubic-bezier(0.22,1,0.36,1);
    --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
    --font-sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,'Segoe UI',sans-serif;
    --font-serif:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
    --font-display:'Cormorant Garamond',Georgia,serif;
    --font-mono:ui-monospace,'SF Mono','JetBrains Mono','Cascadia Code',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:var(--font-sans);
    background:
      radial-gradient(1100px 520px at 50% -140px, rgba(192,154,75,.16), transparent 62%),
      linear-gradient(180deg, var(--night-2) 0%, var(--night) 46%, var(--night-3) 100%);
    background-attachment:fixed;
    color:var(--paper);
    line-height:1.75;
    min-height:100vh;
    padding-bottom:70px;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--gold);color:var(--night-3);}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px;}
  [id]{scroll-margin-top:96px;}
  @media (prefers-reduced-motion:no-preference){ html{scroll-behavior:smooth;} }

  .wrap{max-width:860px;margin:0 auto;padding:0 18px;}

  /* ===== Scroll progress ===== */
  .progress{
    position:fixed;top:0;left:0;z-index:120;
    height:3px;width:0%;
    background:linear-gradient(90deg,var(--gold-deep),var(--gold-light));
    box-shadow:0 0 8px rgba(192,154,75,.5);
  }

  /* ===== Hero ===== */
  .hero{
    position:relative;
    text-align:center;
    padding:60px 20px 0;
    overflow:hidden;
  }
  .kicker{
    font-family:var(--font-display);
    font-weight:600;
    letter-spacing:.48em;
    text-indent:.48em;
    color:var(--gold);
    font-size:14px;
    text-transform:uppercase;
  }
  .kicker::before,.kicker::after{
    content:'◆';
    display:inline-block;
    font-size:8px;
    vertical-align:middle;
    margin:0 14px;
    color:var(--gold-deep);
  }
  .h-title{
    font-family:var(--font-serif);
    font-weight:700;
    font-size:clamp(30px,6vw,46px);
    letter-spacing:.06em;
    color:#f8f4e8;
    margin-top:16px;
    line-height:1.3;
  }
  .h-sub{
    margin-top:12px;
    color:#cfc9b2;
    font-size:15px;
    letter-spacing:.04em;
  }
  .h-sabai{
    font-family:var(--font-display);
    font-style:italic;
    font-weight:500;
    color:var(--gold);
    font-size:19px;
    letter-spacing:.06em;
    margin-top:10px;
  }
  .h-chips{margin-top:22px;display:flex;justify-content:center;flex-wrap:wrap;gap:10px;}
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    border:1px solid rgba(192,154,75,.4);
    color:#e3d9b8;
    background:rgba(192,154,75,.08);
    border-radius:999px;
    padding:5px 14px;
    font-size:13px;
    letter-spacing:.03em;
    cursor:default;
    transition:background .3s ease,color .3s ease,border-color .3s ease,transform .35s var(--ease-spring);
  }
  .chip::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--gold);}
  .chip:hover{background:var(--gold);color:var(--night-3);border-color:var(--gold);transform:scale(1.07);}
  .skyline{position:relative;will-change:transform;}
  .skyline svg{
    display:block;
    width:100%;
    max-width:900px;
    height:150px;
    margin:26px auto -2px;
    opacity:.5;
    animation:float 9s ease-in-out 1.5s infinite;
    will-change:transform;
  }

  /* ===== Nav ===== */
  .nav{
    position:sticky;top:12px;z-index:60;
    width:fit-content;max-width:100%;
    margin:-8px auto 0;
    padding:8px 12px;
    display:flex;flex-wrap:wrap;justify-content:center;gap:4px;
    background:transparent;
    border:1px solid transparent;
    border-radius:999px;
    transition:background .4s ease,border-color .4s ease,box-shadow .4s ease,backdrop-filter .4s ease;
  }
  .nav.scrolled{
    background:rgba(20,26,41,.78);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border-color:rgba(192,154,75,.32);
    box-shadow:0 8px 24px rgba(0,0,0,.3);
  }
  .nav a{
    position:relative;
    color:#d8d2b8;text-decoration:none;
    font-size:13px;padding:4px 11px;border-radius:999px;
    transition:color .2s ease,background .2s ease;
  }
  .nav a::after{
    content:'';position:absolute;left:11px;right:11px;bottom:3px;height:1.5px;
    background:var(--gold-light);border-radius:2px;
    transform:scaleX(0);transform-origin:center;
    transition:transform .3s var(--ease-out);
  }
  .nav a:hover{color:#fff;background:rgba(192,154,75,.18);}
  .nav a:hover::after{transform:scaleX(1);}
  .nav a.active{color:#fff;background:rgba(192,154,75,.2);}
  .nav a.active::after{transform:scaleX(1);}

  /* ===== Cards ===== */
  .card{
    background:var(--paper);
    color:var(--ink);
    border-radius:var(--radius);
    padding:26px 30px;
    margin-top:28px;
    border:1px solid rgba(192,154,75,.26);
    box-shadow:0 16px 42px rgba(0,0,0,.38);
    transition:transform .4s var(--ease-out),box-shadow .4s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 22px 50px rgba(0,0,0,.46);}
  .eyebrow{
    font-family:var(--font-display);
    letter-spacing:.42em;text-transform:uppercase;
    color:var(--gold-deep);font-size:12px;
    display:flex;align-items:center;gap:12px;
  }
  .eyebrow::before,.eyebrow::after{content:'';height:1px;background:var(--gold);flex:1;opacity:.5;}
  .sec-title{
    font-family:var(--font-serif);
    font-size:22px;font-weight:700;margin-top:10px;
    color:var(--ink);letter-spacing:.03em;
  }
  .sec-sub{font-size:13.5px;color:var(--muted);margin-top:6px;}

  /* ===== Tables ===== */
  .tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:18px;}
  .tbl th{
    text-align:left;color:var(--gold-deep);
    font-weight:600;padding:9px 10px;
    border-bottom:2px solid var(--gold);
    white-space:nowrap;
  }
  .tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;}
  .tbl tr:last-child td{border-bottom:none;}
  .tbl tr:nth-child(even) td{background:rgba(239,232,212,.5);}
  .tbl tr.total td{background:var(--paper-2);font-weight:700;border-top:2px solid var(--gold);}

  /* ===== Hotels ===== */
  .hotel{
    background:var(--paper-3);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px 14px;
    margin-top:14px;
    transition:transform .35s var(--ease-out),box-shadow .35s ease,border-color .35s ease;
  }
  .hotel:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.14);border-color:var(--gold);}
  .hotel.hot{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 6px 18px rgba(192,154,75,.18);}
  .hotel.hot:hover{box-shadow:0 0 0 1px var(--gold),0 12px 30px rgba(192,154,75,.26);}
  .h-name{font-size:16px;font-weight:700;color:var(--ink);display:flex;align-items:center;flex-wrap:wrap;gap:8px;}
  .h-price{color:var(--teal);font-weight:700;font-size:14px;margin-top:3px;}
  .h-meta{font-size:12.5px;color:var(--muted);margin:4px 0 8px;}
  .hotel ul{padding-left:18px;}
  .hotel li{margin:3px 0;font-size:14px;}
  .pick{
    display:inline-block;background:var(--gold);color:#fff;
    font-size:11px;padding:2px 10px;border-radius:999px;
    letter-spacing:.08em;font-weight:600;
  }

  /* ===== Budget tabs ===== */
  .tabs{
    display:flex;gap:8px;flex-wrap:wrap;
    margin-top:18px;padding:6px;
    background:rgba(192,154,75,.14);
    border:1px solid var(--line);
    border-radius:14px;
  }
  .tab{
    flex:1;min-width:150px;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:10px 14px;
    border:none;border-radius:10px;cursor:pointer;
    font-family:var(--font-sans);
    font-size:15px;font-weight:700;color:var(--gold-deep);
    background:transparent;
    transition:background .3s ease,color .3s ease,box-shadow .3s ease,transform .3s var(--ease-spring);
  }
  .tab .tab-sub{
    font-size:11px;font-weight:500;color:var(--muted);
    letter-spacing:.04em;transition:color .3s ease;
  }
  .tab:hover{background:rgba(192,154,75,.18);}
  .tab.active{
    background:var(--paper);
    color:var(--gold-deep);
    box-shadow:0 3px 12px rgba(0,0,0,.12);
    transform:translateY(-1px);
  }
  .tab.active .tab-sub{color:var(--gold-deep);}
  .tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .tab-panel[hidden]{display:none;}
  .tab-panel{animation:tabIn .45s var(--ease-out);}
  @keyframes tabIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  html.js .card.in .tab-panel .hotel{transition-delay:calc(var(--i,0)*.08s + .05s);}

  /* ===== Flight cards ===== */
  .flight-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px;}
  @media (max-width:640px){.flight-grid{grid-template-columns:1fr;}}
  .flight-card{
    background:var(--paper-3);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;
    transition:transform .3s var(--ease-out),box-shadow .3s ease,border-color .3s ease;
  }
  .flight-card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.14);border-color:var(--gold);}
  .flight-card.mine{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 6px 18px rgba(192,154,75,.16);}
  .fc-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line);}
  .fc-label{font-size:13px;font-weight:700;color:var(--gold-deep);letter-spacing:.04em;}
  .fc-airline{font-size:11.5px;color:var(--muted);}
  .fc-route{padding:14px 2px;border-bottom:1px dashed var(--line);}
  .fc-route:last-of-type{border-bottom:none;}
  .fc-city{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px;font-size:13px;color:var(--ink);}
  .fc-city .fc-code{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em;}
  .fc-fnum{font-family:var(--font-mono);font-size:16px;font-weight:600;color:var(--teal);margin-top:6px;letter-spacing:.02em;}
  .fc-time{font-size:15px;margin-top:6px;color:var(--ink);}
  .fc-time b{font-family:var(--font-mono);font-size:17px;color:var(--gold-deep);}
  .fc-time em{font-style:normal;color:var(--muted);margin:0 3px;}
  .fc-alt{font-size:12px;color:var(--muted);font-weight:500;margin:0 2px;}
  .fc-note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;}
  .fc-tip{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.6;background:rgba(192,154,75,.08);border-radius:8px;padding:8px 10px;}
  .flight-card.pending{border-style:dashed;border-color:rgba(63,111,89,.52);background:linear-gradient(145deg,var(--paper-3),#f4f9f2);}
  .flight-card.pending .fc-label{color:var(--teal);}
  .flight-card{position:relative;overflow:hidden;}
  .flight-card::after{content:'';position:absolute;width:110px;height:110px;border-radius:50%;right:-54px;bottom:-68px;background:radial-gradient(circle,rgba(192,154,75,.19),transparent 68%);pointer-events:none;transition:transform .6s var(--ease-out);}
  .flight-card:hover::after{transform:scale(1.35);}
  .flight-choice{margin-top:13px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
  .flight-choice span{display:block;padding:7px 6px;background:rgba(63,111,89,.07);border-radius:8px;font-size:11px;line-height:1.45;color:var(--muted);text-align:center;}
  .flight-choice b{display:block;font-size:11px;color:var(--teal);margin-bottom:1px;}
  .flight-choice.recommend{grid-template-columns:1fr;gap:8px;}
  .flight-choice.recommend span{text-align:left;padding:9px 10px;position:relative;}
  .flight-choice.recommend span.primary{background:rgba(192,154,75,.16);border:1px solid rgba(192,154,75,.34);}
  .flight-choice.recommend b{font-size:12px;}

  /* ===== Gentle motion refresh ===== */
  .lanterns{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .lantern{position:absolute;width:11px;height:15px;border:1px solid rgba(224,192,104,.72);border-radius:5px 5px 7px 7px;background:linear-gradient(180deg,rgba(224,192,104,.36),rgba(192,154,75,.04));box-shadow:0 0 16px rgba(224,192,104,.24);animation:lanternFloat var(--d,7s) ease-in-out var(--delay,0s) infinite;}
  .lantern::before{content:'';position:absolute;top:-5px;left:4px;height:5px;border-left:1px solid rgba(224,192,104,.72);}
  .lantern::after{content:'';position:absolute;bottom:-9px;left:4px;height:8px;border-left:1px solid rgba(224,192,104,.55);}
  .lantern.l1{left:9%;top:74px;--d:7.5s;--delay:-1.2s}.lantern.l2{right:13%;top:88px;transform:scale(.72);--d:9s;--delay:-4s}.lantern.l3{right:28%;top:28px;transform:scale(.48);--d:8s;--delay:-2.8s}
  @keyframes lanternFloat{0%,100%{translate:0 0;rotate:-2deg;opacity:.52}50%{translate:5px -12px;rotate:3deg;opacity:.9}}
  .day-head{position:relative;}
  .day-head::after{content:'';position:absolute;right:0;bottom:-17px;width:34px;height:2px;background:var(--gold);border-radius:3px;transform:scaleX(0);transform-origin:right;transition:transform .6s var(--ease-out) .22s;}
  html.js .card.in .day-head::after{transform:scaleX(1);}
  .events .ev:hover .marker{box-shadow:0 0 0 5px rgba(192,154,75,.18),0 4px 12px rgba(192,154,75,.42);}
  .events .ev:hover .ev-title{color:var(--gold-deep);}

  /* ===== Day cards ===== */
  .day-head{
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:14px;
    border-bottom:1px solid var(--line);
    padding-bottom:16px;margin-top:8px;
  }
  .day-id{display:flex;align-items:baseline;gap:10px;}
  .day-num{
    font-family:var(--font-display);
    font-style:italic;font-weight:600;
    font-size:46px;line-height:.9;color:var(--gold-deep);
  }
  .day-lbl{
    font-family:var(--font-display);
    letter-spacing:.3em;text-transform:uppercase;
    font-size:13px;color:var(--muted);
  }
  .day-when{font-size:14px;color:var(--muted);}
  .day-when b{color:var(--gold-deep);font-weight:600;}
  .kw{
    display:inline-block;background:var(--gold-soft);
    color:var(--gold-deep);border:1px solid rgba(166,123,46,.3);
    border-radius:999px;padding:2px 10px;font-size:12px;
    margin:3px 4px 0 0;
  }
  .dayline{
    display:flex;align-items:center;gap:10px;
    margin:12px 0 2px;
  }
  .dayline svg{color:var(--gold);flex-shrink:0;}
  .dayline .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--gold),rgba(192,154,75,.25));}
  .dayline .cap{font-family:var(--font-display);font-style:italic;font-size:12px;color:var(--gold-deep);letter-spacing:.06em;}

  /* ===== Timeline (with scroll-in animation) ===== */
  .events{margin-top:14px;}
  .ev{position:relative;padding-left:30px;padding-bottom:20px;}
  .ev:not(:last-child)::before{
    content:'';position:absolute;left:9px;top:20px;bottom:0;width:2px;
    background:linear-gradient(180deg,var(--gold),rgba(192,154,75,.1));
    transform:scaleY(0);transform-origin:top;
    transition:transform .5s var(--ease-out) calc(var(--i,0)*.06s);
  }
  .ev .marker{
    position:absolute;left:2px;top:4px;width:16px;height:16px;border-radius:50%;
    background:var(--gold);display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 3px var(--paper-3),0 2px 8px rgba(192,154,75,.5);
    transform:scale(0);
    transition:transform .35s var(--ease-spring) calc(var(--i,0)*.06s + .04s);
  }
  .ev .marker svg{width:16px;height:16px;color:#fff;}
  .ev .time{
    font-family:var(--font-mono);
    font-size:13px;font-weight:700;color:var(--gold-deep);letter-spacing:.02em;
    opacity:0;transform:translateY(4px);
    transition:opacity .3s ease calc(var(--i,0)*.06s + .08s),transform .3s var(--ease-out) calc(var(--i,0)*.06s + .08s);
  }
  .ev-title{font-size:15.5px;font-weight:700;color:var(--ink);margin:1px 0 4px;}
  .ev-title span{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px;}
  .ev ul{padding-left:18px;opacity:0;transform:translateY(6px);
    transition:opacity .3s ease calc(var(--i,0)*.06s + .12s),transform .3s var(--ease-out) calc(var(--i,0)*.06s + .12s);
  }
  .ev li{margin:3px 0;font-size:14px;color:#3c3d45;}
  .ev li b{color:var(--ink);}

  /* ===== Reveal states (JS on) ===== */
  html.js .card{opacity:0;transform:translateY(18px);transition:opacity .4s ease,transform .4s var(--ease-out),box-shadow .4s ease;}
  html.js .card.in{opacity:1;transform:none;}
  html.js .card .num{transform:scale(.4);opacity:0;transition:transform .35s var(--ease-spring),opacity .3s ease;}
  html.js .card.in .num{transform:scale(1);opacity:1;transition-delay:.06s;}
  html.js .card .tip{opacity:0;transform:translateX(-10px);transition:opacity .3s ease,transform .3s var(--ease-out);}
  html.js .card.in .tip{opacity:1;transform:none;transition-delay:.08s;}
  html.js .foods .food{opacity:0;transform:translateY(10px);transition:opacity .3s ease,transform .3s var(--ease-out);}
  html.js .card.in .foods .food{opacity:1;transform:none;}
  html.js .card.in .foods .food:nth-child(1){transition-delay:.02s;}
  html.js .card.in .foods .food:nth-child(2){transition-delay:.05s;}
  html.js .card.in .foods .food:nth-child(3){transition-delay:.08s;}
  html.js .card.in .foods .food:nth-child(4){transition-delay:.11s;}
  html.js .card.in .foods .food:nth-child(5){transition-delay:.14s;}
  html.js .card.in .foods .food:nth-child(6){transition-delay:.17s;}
  html.js .hotel{opacity:0;transform:translateY(10px);transition:opacity .3s ease,transform .3s var(--ease-out);}
  html.js .card.in .hotel{opacity:1;transform:none;transition-delay:calc(var(--i,0)*.05s + .03s);}
  html.js .ev{opacity:0;transform:translateY(10px);transition:opacity .35s ease,transform .35s var(--ease-out);}
  html.js .ev.in{opacity:1;transform:none;}
  html.js .ev.in:not(:last-child)::before{transform:scaleY(1);}
  html.js .ev.in .marker{transform:scale(1);}
  html.js .ev.in .time{opacity:1;transform:none;}
  html.js .ev.in ul{opacity:1;transform:none;}

  /* ===== Hero entrance animations ===== */
  html.js .hero .kicker{animation:fadeDown .7s ease .12s backwards;}
  html.js .hero .h-title{animation:titleIn .95s var(--ease-out) .28s backwards;}
  html.js .hero .h-sub{animation:fadeUp .8s var(--ease-out) .5s backwards;}
  html.js .hero .h-sabai{animation:fadeUp .8s var(--ease-out) .64s backwards;}
  html.js .hero .chip{opacity:0;transform:translateY(12px) scale(.92);animation:chipIn .55s var(--ease-spring) both;}
  html.js .hero .chip:nth-child(1){animation-delay:.68s;}
  html.js .hero .chip:nth-child(2){animation-delay:.78s;}
  html.js .hero .chip:nth-child(3){animation-delay:.88s;}

      evs.forEach(function(ev){ ioEv.observe(ev); });
    }

    /* 滚动驱动效果：进度条 + 导航毛玻璃 + hero 视差淡出 */
    var progress = document.getElementById('progress');
    var nav = document.getElementById('nav');
    var heroInner = document.querySelector('.hero-inner');
    var skyline = document.querySelector('.skyline');
    var ticking = false;

    function onScroll(){
      ticking = false;
      var st = window.scrollY || window.pageYOffset;
      var max = document.documentElement.scrollHeight - window.innerHeight;
      progress.style.width = (max > 0 ? (st / max) * 100 : 0) + '%';
      nav.classList.toggle('scrolled', st > 30);
      if(heroInner){
        heroInner.style.transform = 'translateY(' + Math.round(st * 0.22) + 'px)';
        heroInner.style.opacity = Math.max(0, 1 - st / 520);
      }
      if(skyline){
        skyline.style.transform = 'translateY(' + Math.round(st * 0.12) + 'px)';
      }
    }
    window.addEventListener('scroll', function(){
      if(!ticking){ ticking = true; requestAnimationFrame(onScroll); }
    }, {passive:true});
    onScroll();

    /* 预算 tab 切换 */
    var tabs = document.querySelectorAll('.tabs .tab');
    var panels = document.querySelectorAll('.tab-panel');
    function switchTab(btn){
      var target = btn.getAttribute('aria-controls');
      tabs.forEach(function(t){
        var active = t === btn;
        t.classList.toggle('active', active);
        t.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      panels.forEach(function(p){
        var show = p.id === target;
        if(show){ p.removeAttribute('hidden'); p.classList.add('active'); }
        else { p.setAttribute('hidden',''); p.classList.remove('active'); }
      });
    }
    tabs.forEach(function(btn, i){
      btn.addEventListener('click', function(){ switchTab(btn); });
      btn.addEventListener('keydown', function(e){
        var dir = (e.key === 'ArrowRight' || e.key === 'ArrowDown') ? 1 : (e.key === 'ArrowLeft' || e.key === 'ArrowUp') ? -1 : 0;
        if(dir !== 0){
          e.preventDefault();
          var next = tabs[(i + dir + tabs.length) % tabs.length];
          switchTab(next); next.focus();
        }
      });
    });

    /* 导航随阅读位置轻点亮，方便长页面快速定位 */
    var navLinks = document.querySelectorAll('.nav a');
    if('IntersectionObserver' in window){
      var sectionIO = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if(entry.isIntersecting){
            navLinks.forEach(function(link){
              link.classList.toggle('active', link.getAttribute('href') === '#' + entry.target.id);
            });
          }
        });
      }, {rootMargin:'-28% 0px -62% 0px', threshold:0});
      document.querySelectorAll('.card[id]').forEach(function(section){ sectionIO.observe(section); });
    }
  })();
</script>

</body>
</html>
