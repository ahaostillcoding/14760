    <style>
      :root {
        --bg: #f5efe6;
        --bg-strong: #e8ddcf;
        --panel: rgba(255, 252, 247, 0.94);
        --panel-strong: #fffdf9;
        --text: #17232f;
        --muted: #637283;
        --line: rgba(23, 35, 47, 0.1);
        --line-strong: rgba(23, 35, 47, 0.18);
        --brand: #0f6b66;
        --brand-soft: rgba(15, 107, 102, 0.1);
        --accent: #c26d2c;
        --accent-soft: rgba(194, 109, 44, 0.12);
        --warn: #a44b3e;
        --warn-soft: rgba(164, 75, 62, 0.12);
        --ink: #0d1822;
        --shadow: 0 24px 64px rgba(17, 28, 38, 0.12);
        --radius-xl: 28px;
        --radius-lg: 22px;
        --radius-md: 16px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        color: var(--text);
        font-family: "Noto Sans SC", system-ui, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(15, 107, 102, 0.16), transparent 25%),
          radial-gradient(circle at top right, rgba(194, 109, 44, 0.12), transparent 20%),
          linear-gradient(180deg, #fbf8f3 0%, var(--bg) 54%, var(--bg-strong) 100%);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        width: min(1240px, calc(100% - 28px));
        margin: 0 auto;
        padding: 24px 0 80px;
      }

      .mono {
        font-family: "Manrope", sans-serif;
      }

      .hero {
        position: relative;
        overflow: hidden;
        padding: 34px;
        border-radius: var(--radius-xl);
        border: 1px solid rgba(255, 255, 255, 0.68);
        background:
          linear-gradient(135deg, rgba(15, 107, 102, 0.98), rgba(13, 32, 41, 0.97)),
          linear-gradient(145deg, rgba(194, 109, 44, 0.3), transparent 45%);
        color: #f8fbfb;
        box-shadow: var(--shadow);
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: auto -60px -80px auto;
        width: 280px;
        height: 280px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.18), transparent 68%);
        pointer-events: none;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        font-size: 13px;
        letter-spacing: 0.04em;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.9fr);
        gap: 24px;
        margin-top: 20px;
      }

      .hero h1 {
        margin: 0 0 14px;
        font-size: clamp(34px, 5vw, 56px);
        line-height: 1.02;
      }

      .hero p {
        margin: 0;
        max-width: 760px;
        color: rgba(248, 251, 251, 0.84);
        font-size: 16px;
        line-height: 1.78;
      }

      .hero-panel {
        display: grid;
        gap: 14px;
        align-content: start;
      }

      .snapshot,
      .toc,
      .section,
      .card,
      .summary-card {
        border-radius: var(--radius-lg);
        border: 1px solid var(--line);
        background: var(--panel);
        backdrop-filter: blur(16px);
      }

      .snapshot {
        padding: 20px;
      }

      .snapshot-title,
      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .snapshot-title h2,
      .section-title h2 {
        margin: 0;
        font-size: 20px;
      }

      .snapshot-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 16px;
      }

      .metric {
        padding: 14px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .metric strong {
        display: block;
        font-size: 26px;
        line-height: 1;
      }

      .metric span {
        display: block;
        margin-top: 8px;
        font-size: 13px;
        color: rgba(248, 251, 251, 0.7);
      }

      .toc {
        padding: 18px 20px;
      }

      .toc ul {
        margin: 12px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 10px;
      }

      .toc li {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
      }

      .toc-index {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: inline-grid;
        place-items: center;
        background: var(--brand-soft);
        color: var(--brand);
        font-size: 12px;
        font-weight: 800;
      }

      .main {
        display: grid;
        gap: 22px;
        margin-top: 22px;
      }

      .section {
        padding: 24px;
        box-shadow: var(--shadow);
      }

      .section-desc {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.8;
      }

      .chip-row,
      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip,
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }

      .chip {
        background: var(--brand-soft);
        color: var(--brand);
      }

      .tag {
        background: rgba(23, 35, 47, 0.06);
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 16px;
        margin-top: 20px;
      }

      .card,
      .summary-card {
        padding: 20px;
      }

      .span-4 {
        grid-column: span 4;
      }

      .span-6 {
        grid-column: span 6;
      }

      .span-12 {
        grid-column: span 12;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: flex-start;
      }

      .card h3 {
        margin: 0;
        font-size: 21px;
        line-height: 1.35;
      }

      .card-subtitle {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      .stat {
        min-width: 92px;
        padding: 10px 12px;
        border-radius: 16px;
        background: var(--accent-soft);
        color: var(--accent);
        text-align: right;
      }

      .stat strong {
        display: block;
        font-size: 17px;
      }

      .stat span {
        font-size: 12px;
      }

      .summary-card {
        background: linear-gradient(160deg, rgba(15, 107, 102, 0.08), rgba(194, 109, 44, 0.06));
      }

      .summary-card p,
      .card p,
      .card li {
        margin: 0;
        color: var(--muted);
        line-height: 1.75;
        font-size: 14px;
      }

      .key-block {
        margin-top: 16px;
        padding: 14px;
        border-radius: 16px;
        background: rgba(23, 35, 47, 0.04);
      }

      .key-block strong,
      .mini-title {
        display: block;
        margin-bottom: 8px;
        color: var(--ink);
        font-size: 13px;
      }

      .list {
        margin: 14px 0 0;
        padding-left: 18px;
        display: grid;
        gap: 8px;
      }

      .meta {
        margin-top: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }

      .source-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 999px;
        background: var(--panel-strong);
        border: 1px solid var(--line);
        color: var(--ink);
        font-weight: 700;
        transition:
          transform 180ms ease,
          border-color 180ms ease,
          box-shadow 180ms ease;
      }

      .source-link:hover {
        transform: translateY(-2px);
        border-color: var(--brand);
        box-shadow: 0 12px 24px rgba(15, 107, 102, 0.12);
      }

      .callout {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 14px;
        background: var(--warn-soft);
        color: #7c392e;
        font-size: 13px;
        line-height: 1.7;
      }

      .footer {
        margin-top: 24px;
        padding: 18px 20px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.8;
      }

      @media (max-width: 1100px) {
        .hero-grid,
        .snapshot-grid {
          grid-template-columns: 1fr;
        }

        .span-4,
        .span-6 {
          grid-column: span 12;
        }
      }

      @media (max-width: 720px) {
        .page {
          width: min(100% - 18px, 1240px);
          padding-top: 16px;
        }

        .hero,
        .section {
          padding: 20px;
        }

        .card,
        .summary-card,
        .snapshot,
        .toc {
          padding: 16px;
        }

        .card-header {
          flex-direction: column;
        }

        .stat {
          text-align: left;
        }

        .hero h1 {
          font-size: 34px;
        }
      }
    </style>

      function Pill({ children, tone = "default" }) {
        const className = tone === "chip" ? "chip" : "tag";
        return <span className={className}>{children}</span>;
      }

      function SectionHeader({ id, title, desc, chips = [] }) {
        return (
          <div id={id}>
            <div className="section-title">
              <h2>{title}</h2>
              <div className="chip-row">
                {chips.map((chip) => (
                  <Pill key={chip} tone="chip">
                    {chip}
                  </Pill>
                ))}
              </div>
            </div>
            {desc ? <p className="section-desc">{desc}</p> : null}
          </div>
        );
      }

      function ProjectCard({ item }) {
        return (
          <article className="card span-6">
            <div className="card-header">
              <div>
                <h3>{item.name}</h3>
                <p className="card-subtitle">最近活跃：{item.updatedAt}</p>
              </div>
              <div className="stat">
                <strong>{item.stars}</strong>
                <span>GitHub Stars</span>
              </div>
            </div>
            <div className="tag-row" style={{ marginTop: 14 }}>
              {item.tags.map((tag) => (
                <Pill key={tag}>{tag}</Pill>
              ))}
            </div>
            <div className="key-block">
              <strong>主要用途</strong>
              <p>{item.purpose}</p>
            </div>
            <div className="key-block">
              <strong>核心亮点</strong>
              <p>{item.highlight}</p>
            </div>
            <div className="key-block">
              <strong>为什么现在值得看</strong>
              <p>{item.whyNow}</p>
            </div>
            <div className="meta">
              <span className="mini-title">来源：GitHub 仓库元数据</span>
              <a className="source-link" href={item.url} target="_blank" rel="noreferrer">
                查看项目
              </a>
            </div>
          </article>
        );
      }

      function NewsCard({ item, compact = false }) {
        return (
          <article className={`card ${compact ? "span-4" : "span-6"}`}>
            <div className="card-header">
              <div>
                <h3>{item.title}</h3>
                <p className="card-subtitle">{item.source}</p>
              </div>
            </div>
            <div className="tag-row" style={{ marginTop: 14 }}>
              {item.tags.map((tag) => (
                <Pill key={tag}>{tag}</Pill>
              ))}
            </div>
            <div className="key-block">
              <strong>事件摘要</strong>
              <p>{item.summary}</p>
            </div>
            <div className="key-block">
              <strong>影响判断</strong>
              <p>{item.impact}</p>
            </div>
            {item.audience ? (
              <div className="key-block">
                <strong>适合关注的人群</strong>
                <p>{item.audience}</p>
              </div>
            ) : null}
            {item.note ? <div className="callout">{item.note}</div> : null}
            <div className="meta">
              <span className="mini-title">来源链接</span>
              <a className="source-link" href={item.url} target="_blank" rel="noreferrer">
                打开原文
              </a>
            </div>
          </article>
        );
      }

      function IdeaCard({ item }) {
        return (
          <article className="card span-6">
            <h3>{item.title}</h3>
            <div className="tag-row" style={{ marginTop: 14 }}>
              {item.tags.map((tag) => (
                <Pill key={tag}>{tag}</Pill>
              ))}
            </div>
            <div className="key-block">
              <strong>可以做什么</strong>
              <p>{item.what}</p>
            </div>
            <div className="key-block">
              <strong>适合技术栈 / 组件</strong>
              <p>{item.stack}</p>
            </div>
            <div className="key-block">
              <strong>MVP 思路</strong>

              </section>

              <section className="section">
                <SectionHeader

                  chips={["MVP Ready", "Builder Mode"]}
                />
                <div className="grid">
                  {report.vibeIdeas.map((item) => (
                    <IdeaCard key={item.title} item={item} />
                  ))}
                </div>
              </section>

              <section className="section">
                <SectionHeader

                  chips={["Signal", "Decision"]}
                />
                <div className="summary-card">
                  <p style={{ fontSize: 15, color: "var(--text)", lineHeight: 1.95 }}>{report.totalTrend}</p>
                </div>
              </section>
            </main>

            <footer className="footer">
              数据说明：GitHub 项目信息基于 GitHub 仓库元数据与最近活跃时间筛选；新闻与科技热点优先采用 AP News、Business
              Insider、Tom&apos;s Hardware 等近 7-14 天内可检索来源。带“待进一步确认”的结论表示目前更多来自媒体解读或厂商口径，建议继续追踪官方文档与后续实测。
            </footer>
          </div>

      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
