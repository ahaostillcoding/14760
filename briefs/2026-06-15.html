        <style>
      :root {
        --bg: #f7f5f0;
        --bg-strong: #efe8db;
        --panel: rgba(255, 252, 247, 0.92);
        --panel-strong: #fffdfa;
        --text: #15202a;
        --muted: #637182;
        --line: rgba(21, 32, 42, 0.1);
        --line-strong: rgba(21, 32, 42, 0.18);
        --brand: #0e6a62;
        --brand-soft: rgba(14, 106, 98, 0.1);
        --accent: #c36b2c;
        --accent-soft: rgba(195, 107, 44, 0.12);
        --danger: #a3483f;
        --danger-soft: rgba(163, 72, 63, 0.12);
        --ink: #0d1b28;
        --shadow: 0 28px 56px rgba(19, 32, 44, 0.12);
        --radius-xl: 30px;
        --radius-lg: 22px;
        --radius-md: 16px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        color: var(--text);
        font-family: "Noto Sans SC", system-ui, sans-serif;
        background:
          radial-gradient(circle at left top, rgba(14, 106, 98, 0.14), transparent 24%),
          radial-gradient(circle at right top, rgba(195, 107, 44, 0.12), transparent 20%),
          linear-gradient(180deg, #fcfaf6 0%, var(--bg) 52%, var(--bg-strong) 100%);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        width: min(1240px, calc(100% - 28px));
        margin: 0 auto;
        padding: 22px 0 84px;
      }

      .mono {
        font-family: "Manrope", sans-serif;
      }

      .hero {
        position: relative;
        overflow: hidden;
        padding: 36px;
        border-radius: var(--radius-xl);
        color: #fffaf3;
        background:
          linear-gradient(136deg, rgba(10, 28, 42, 0.97), rgba(13, 76, 92, 0.94) 56%, rgba(178, 100, 45, 0.92)),
          #0d2432;
        box-shadow: var(--shadow);
      }

      .hero::before,
      .hero::after {
        content: "";
        position: absolute;
        border-radius: 999px;
        pointer-events: none;
      }

      .hero::before {
        width: 320px;
        height: 320px;
        right: -110px;
        top: -140px;
        background: rgba(255, 255, 255, 0.07);
      }

      .hero::after {
        width: 240px;
        height: 240px;
        left: -90px;
        bottom: -120px;
        background: rgba(255, 255, 255, 0.06);
      }

      .hero-grid,
      .summary-grid,
      .card-grid,
      .trend-grid,
      .idea-grid,
      .note-grid,
      .topline-grid,
      .section-nav {
        display: grid;
        gap: 16px;
      }

      .hero-grid {
        position: relative;
        z-index: 1;
        grid-template-columns: minmax(0, 1.7fr) minmax(320px, 1fr);
        gap: 24px;
      }

      .hero h1 {
        margin: 12px 0 14px;
        font-size: clamp(2.4rem, 4vw, 4.4rem);
        line-height: 0.98;
        letter-spacing: -0.05em;
      }

      .hero-intro {
        max-width: 780px;
        margin: 0;
        color: rgba(255, 250, 243, 0.86);
        line-height: 1.78;
        font-size: 1.03rem;
      }

      .hero-meta {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-top: 24px;
      }

      .hero-meta-card,
      .hero-side,
      .section-shell,
      .card,
      .summary-card,
      .trend-card,
      .note-card {
        border: 1px solid var(--line);
      }

      .hero-meta-card {
        padding: 16px 18px;
        border-radius: var(--radius-md);
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(12px);
      }

      .hero-meta-card .label {
        display: block;
        margin-bottom: 8px;
        color: rgba(255, 250, 243, 0.68);
        font-size: 0.79rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .hero-meta-card .value {
        display: block;
        font-size: 1.14rem;
        line-height: 1.45;
        font-weight: 700;
      }

      .hero-side {
        padding: 24px;
        border-radius: var(--radius-lg);
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(12px);
      }

      .hero-side h2,
      .section-head h2,
      .footer-panel h2 {
        margin: 0;
        font-size: 1rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .hero-side ul {
        margin: 18px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 16px;
      }

      .hero-side li {
        border-top: 1px solid rgba(255, 255, 255, 0.14);
        padding-top: 16px;
      }

      .hero-side li:first-child {
        border-top: 0;
        padding-top: 0;
      }

      .hero-side strong {
        display: block;
        margin-bottom: 6px;
      }

      .hero-side p {
        margin: 0;
        color: rgba(255, 250, 243, 0.76);
        line-height: 1.68;
        font-size: 0.94rem;
      }

      .section-nav {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        margin: 20px 0 26px;
      }

      .section-nav a {
        padding: 14px 16px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.6);
        color: var(--muted);
        font-size: 0.95rem;
        text-align: center;
        transition: transform 180ms ease, color 180ms ease, border-color 180ms ease;
      }

      .section-nav a:hover {
        transform: translateY(-2px);
        color: var(--brand);
        border-color: var(--brand);
      }

      .topline-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin-bottom: 28px;
      }

      .summary-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin-bottom: 26px;
      }

      .summary-card {
        padding: 20px 22px;
        border-radius: var(--radius-lg);
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .summary-card h3,
      .card h3,
      .trend-card h3,
      .note-card h3 {
        margin: 0;
        font-size: 1.14rem;
        line-height: 1.46;
      }

      .summary-card p,
      .card p,
      .trend-card p,
      .note-card p,
      .section-head p,
      .footer-panel p {
        margin: 0;
        color: var(--muted);
        line-height: 1.72;
      }

      .section-shell {
        margin-top: 22px;
        padding: 26px;
        border-radius: var(--radius-xl);
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-end;
        margin-bottom: 20px;
      }

      .section-head p {
        margin-top: 10px;
        max-width: 820px;
      }

      .section-count {
        flex-shrink: 0;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.8);
        color: var(--muted);
        font-size: 0.88rem;
      }

      .card-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .card {
        display: grid;
        gap: 14px;
        padding: 22px;
        border-radius: var(--radius-lg);
        background: var(--panel-strong);
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
      }

      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        border-radius: 999px;
        line-height: 1;
        font-size: 0.82rem;
        background: var(--brand-soft);
        color: var(--brand);
      }

      .pill.accent {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .pill.warn {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .mini-tag {
        padding: 7px 10px;
        border-radius: 10px;
        background: rgba(21, 32, 42, 0.05);
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1;
      }

      .source-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--brand);
        font-weight: 700;
        font-size: 0.93rem;
      }

      .source-link::after {
        content: "↗";
        font-size: 0.96rem;
      }

      .card-top a:hover h3 {
        color: var(--brand);
      }

      .card-block {
        padding: 14px 15px;
        border-radius: 14px;
        background: rgba(14, 106, 98, 0.06);
        border: 1px solid rgba(14, 106, 98, 0.1);
      }

      .card-block.accent {
        background: rgba(195, 107, 44, 0.08);
        border-color: rgba(195, 107, 44, 0.12);
      }

      .card-block.warn {
        background: rgba(163, 72, 63, 0.08);
        border-color: rgba(163, 72, 63, 0.12);
      }

      .card-block strong {
        display: block;
        margin-bottom: 8px;
        color: var(--text);
        font-size: 0.96rem;
      }

      .card-footer {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }

      .source-note {
        color: var(--muted);
        font-size: 0.84rem;
      }

      .trend-grid,
      .idea-grid,
      .note-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .trend-card,
      .note-card {
        padding: 20px;
        border-radius: var(--radius-lg);
        background: rgba(255, 255, 255, 0.76);
      }

      .footer-panel {
        padding: 26px;
        border-radius: var(--radius-xl);
        color: #fffaf3;
        background: linear-gradient(135deg, #17212b, #0f4257);
        box-shadow: var(--shadow);
      }

      .footer-panel p {
        margin-top: 12px;
        color: rgba(255, 250, 243, 0.82);
      }

      .muted-line {
        margin-top: 14px;
        color: var(--muted);
        font-size: 0.88rem;
      }

      @media (max-width: 1100px) {
        .hero-grid,
        .summary-grid,
        .topline-grid,
        .trend-grid,
        .idea-grid,
        .note-grid {
          grid-template-columns: 1fr;
        }

        .section-nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 860px) {
        .page {
          width: min(100% - 20px, 1240px);
          padding-top: 14px;
        }

        .hero,
        .section-shell,
        .footer-panel {
          padding: 22px;
        }

        .hero-meta,
        .card-grid {
          grid-template-columns: 1fr;
        }

        .section-head,
        .card-top,
        .card-footer {
          display: grid;
        }

        .section-count {
          justify-self: start;
        }

        .section-nav {
          grid-template-columns: 1fr;
        }
      }
    </style>
