        <style>
      :root {
        --bg: #f6f3ed;
        --bg-deep: #ece4d7;
        --panel: rgba(255, 252, 248, 0.88);
        --panel-strong: #fffdf9;
        --text: #172129;
        --muted: #63707d;
        --line: rgba(23, 33, 41, 0.1);
        --line-strong: rgba(23, 33, 41, 0.18);
        --brand: #0b6b63;
        --brand-soft: rgba(11, 107, 99, 0.12);
        --accent: #c56e2e;
        --accent-soft: rgba(197, 110, 46, 0.12);
        --danger: #a64d3e;
        --danger-soft: rgba(166, 77, 62, 0.12);
        --shadow: 0 24px 55px rgba(30, 41, 53, 0.12);
        --radius-xl: 30px;
        --radius-lg: 22px;
        --radius-md: 16px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        color: var(--text);
        font-family: "Noto Sans SC", system-ui, sans-serif;
        background:
          radial-gradient(circle at 0% 0%, rgba(11, 107, 99, 0.14), transparent 24%),
          radial-gradient(circle at 100% 0%, rgba(197, 110, 46, 0.12), transparent 22%),
          linear-gradient(180deg, #fbf8f3 0%, var(--bg) 55%, var(--bg-deep) 100%);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        width: min(1220px, calc(100% - 28px));
        margin: 0 auto;
        padding: 22px 0 84px;
      }

      .mono {
        font-family: "Manrope", sans-serif;
      }

      .hero {
        position: relative;
        overflow: hidden;
        padding: 34px;
        border-radius: var(--radius-xl);
        color: #fbf8f2;
        background:
          linear-gradient(135deg, rgba(7, 29, 44, 0.96), rgba(14, 76, 92, 0.92) 54%, rgba(177, 100, 45, 0.88)),
          #0f2231;
        box-shadow: var(--shadow);
      }

      .hero::before,
      .hero::after {
        content: "";
        position: absolute;
        border-radius: 999px;
        pointer-events: none;
      }

      .hero::before {
        width: 300px;
        height: 300px;
        top: -140px;
        right: -90px;
        background: rgba(255, 255, 255, 0.08);
      }

      .hero::after {
        width: 220px;
        height: 220px;
        bottom: -120px;
        left: -80px;
        background: rgba(255, 255, 255, 0.06);
      }

      .hero-grid {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: minmax(0, 1.7fr) minmax(320px, 1fr);
        gap: 24px;
        align-items: stretch;
      }

      .hero h1 {
        margin: 12px 0 14px;
        font-size: clamp(2.4rem, 4vw, 4.2rem);
        line-height: 0.98;
        letter-spacing: -0.05em;
      }

      .hero-intro {
        max-width: 760px;
        color: rgba(251, 248, 242, 0.86);
        font-size: 1.02rem;
        line-height: 1.76;
      }

      .hero-meta,
      .hero-tags,
      .section-nav,
      .mini-grid,
      .card-grid,
      .trend-grid,
      .suggestion-grid,
      .source-grid,
      .summary-grid {
        display: grid;
        gap: 14px;
      }

      .hero-meta {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin-top: 24px;
      }

      .hero-meta-card,
      .hero-side,
      .section-shell,
      .card,
      .summary-card,
      .trend-card,
      .source-card {
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(14px);
      }

      .hero-meta-card {
        padding: 16px 18px;
        border-radius: var(--radius-md);
      }

      .hero-meta-card span {
        display: block;
      }

      .hero-meta-card .label {
        margin-bottom: 8px;
        font-size: 0.8rem;
        color: rgba(251, 248, 242, 0.66);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .hero-meta-card .value {
        font-size: 1.15rem;
        line-height: 1.45;
        font-weight: 700;
      }

      .hero-side {
        padding: 24px;
        border-radius: var(--radius-lg);
      }

      .hero-side h2,
      .section-head h2,
      .footer-note h2 {
        margin: 0;
        font-size: 1rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .hero-side ul {
        margin: 18px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 16px;
      }

      .hero-side li {
        padding-top: 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
      }

      .hero-side li:first-child {
        padding-top: 0;
        border-top: 0;
      }

      .hero-side strong {
        display: block;
        margin-bottom: 6px;
        font-size: 1rem;
      }

      .hero-side p {
        margin: 0;
        color: rgba(251, 248, 242, 0.76);
        line-height: 1.65;
        font-size: 0.94rem;
      }

      .section-nav {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        margin: 18px 0 26px;
      }

      .section-nav a {
        padding: 14px 16px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.56);
        color: var(--muted);
        font-size: 0.95rem;
        text-align: center;
        transition: transform 180ms ease, border-color 180ms ease, color 180ms ease;
      }

      .section-nav a:hover {
        transform: translateY(-2px);
        border-color: var(--brand);
        color: var(--brand);
      }

      .summary-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin-bottom: 26px;
      }

      .summary-card {
        padding: 20px 22px;
        border-radius: var(--radius-lg);
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }

      .summary-card .pill {
        margin-bottom: 14px;
      }

      .summary-card h3,
      .card h3,
      .trend-card h3,
      .source-card h3 {
        margin: 0;
        font-size: 1.15rem;
        line-height: 1.45;
      }

      .summary-card p,
      .card p,
      .trend-card p,
      .source-card p,
      .footer-note p {
        margin: 0;
        color: var(--muted);
        line-height: 1.72;
      }

      .section-shell {
        margin-top: 20px;
        padding: 26px;
        border-radius: var(--radius-xl);
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-end;
        margin-bottom: 20px;
      }

      .section-head p {
        margin: 10px 0 0;
        color: var(--muted);
        line-height: 1.72;
        max-width: 780px;
      }

      .section-count {
        flex-shrink: 0;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.72);
        font-size: 0.88rem;
        color: var(--muted);
      }

      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        border-radius: 999px;
        font-size: 0.82rem;
        line-height: 1;
        background: var(--brand-soft);
        color: var(--brand);
      }

      .pill.warn {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .pill.accent {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .card-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .card {
        padding: 22px;
        border-radius: var(--radius-lg);
        background: var(--panel-strong);
        border: 1px solid var(--line);
        display: grid;
        gap: 14px;
      }

      .card-top {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
      }

      .card-top a {
        color: inherit;
      }

      .card-top a:hover h3 {
        color: var(--brand);
      }

      .source-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--brand);
        font-weight: 700;
        font-size: 0.93rem;
      }

      .source-link::after {
        content: "↗";
        font-size: 0.96rem;
      }

      .card-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .mini-tag {
        padding: 7px 10px;
        border-radius: 10px;
        background: rgba(23, 33, 41, 0.05);
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1;
      }

      .card-block {
        padding: 14px 15px;
        border-radius: 14px;
        background: rgba(11, 107, 99, 0.06);
        border: 1px solid rgba(11, 107, 99, 0.1);
      }

      .card-block strong {
        display: block;
        margin-bottom: 8px;
        color: var(--text);
        font-size: 0.96rem;
      }

      .card-footer {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        padding-top: 4px;
      }

      .card-footer .source-note {
        color: var(--muted);
        font-size: 0.84rem;
      }

      .trend-grid,
      .suggestion-grid,
      .source-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .trend-card,
      .source-card {
        padding: 20px;
        border-radius: var(--radius-lg);
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid var(--line);
      }

      .footer-note {
        margin-top: 22px;
        padding: 26px;
        border-radius: var(--radius-xl);
        color: #fbf8f3;
        background: linear-gradient(135deg, #17212b, #0e4459);
        box-shadow: var(--shadow);
      }

      .footer-note p {
        margin-top: 12px;
        color: rgba(251, 248, 243, 0.8);
      }

      .footer-note .pill {
        background: rgba(255, 255, 255, 0.1);
        color: #fbf8f3;
      }

      .muted-line {
        margin-top: 12px;
        font-size: 0.88rem;
        color: var(--muted);
      }

      @media (max-width: 1100px) {
        .hero-grid,
        .summary-grid,
        .trend-grid,
        .suggestion-grid,
        .source-grid {
          grid-template-columns: 1fr;
        }

        .section-nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 860px) {
        .page {
          width: min(100% - 20px, 1220px);
          padding-top: 14px;
        }

        .hero,
        .section-shell,
        .footer-note {
          padding: 22px;
        }

        .hero-meta,
        .card-grid {
          grid-template-columns: 1fr;
        }

        .section-head,
        .card-top,
        .card-footer {
          display: grid;
        }

        .section-count {
          justify-self: start;
        }

        .section-nav {
          grid-template-columns: 1fr;
        }
      }
    </style>
